<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-label="Animated terminal-style GitHub profile banner">
  <defs>
    <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#0891B2"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
    <clipPath id="portraitClip"><rect x="52" y="150" width="330" height="390" rx="8"/></clipPath>
    <style>
      .mono { font-family: 'Courier New', monospace; }
      .tech { opacity:.35; animation: glow 8s infinite; }
      .t0 { animation-delay:0s } .t1 { animation-delay:2s }
      .t2 { animation-delay:4s } .t3 { animation-delay:6s }
      @keyframes glow { 0%,18%,100% {opacity:.35; filter:none} 7%,13% {opacity:1; filter:drop-shadow(0 0 8px currentColor)} }
      .blink { animation: blink 1s steps(2,end) infinite; }
      @keyframes blink { 50% {opacity:0} }
      .portrait { animation: reveal 3.2s ease-out both; }
      @keyframes reveal { from {opacity:0; transform:translateY(10px)} to {opacity:1; transform:translateY(0)} }
      @media (prefers-reduced-motion: reduce) { .tech,.blink,.portrait {animation:none} }
    </style>
  </defs>
  <rect width="1180" height="610" rx="22" fill="#F7F8FC"/>
  <rect x="1.5" y="1.5" width="1177" height="607" rx="22" fill="none" stroke="url(#edge)" stroke-width="2"/>
  <path d="M2 82H1178" stroke="url(#edge)" stroke-width="2"/>
  <circle cx="34" cy="42" r="10" fill="#FF5F57"/><circle cx="66" cy="42" r="10" fill="#FEBC2E"/><circle cx="98" cy="42" r="10" fill="#28C840"/>
  <text x="145" y="51" class="mono" font-size="25" fill="#172033"> &gt;_ profile.sh <tspan fill="#0891B2">--live</tspan></text>
  <rect x="1015" y="22" width="132" height="40" rx="20" fill="#FFFFFF" stroke="#EF4444" stroke-opacity=".5"/>
  <circle cx="1038" cy="42" r="7" fill="#EF4444"><animate attributeName="opacity" values="1;.3;1" dur="1.2s" repeatCount="indefinite"/></circle>
  <text x="1055" y="50" class="mono" font-size="19" fill="#EF4444">LIVE</text>

  <rect x="32" y="105" width="370" height="475" rx="15" fill="#FFFFFF" stroke="#0891B2" stroke-width="1.5"/>
  <text x="55" y="137" class="mono" font-size="19" font-weight="bold" fill="#0891B2">VISUAL.MAP</text>
  <path d="M52 146H382" stroke="#0891B2" stroke-opacity=".6"/>
  <rect x="52" y="150" width="330" height="390" rx="8" fill="#E9EDF5"/>
  <g clip-path="url(#portraitClip)" class="portrait">
    <image x="52" y="150" width="330" height="390" href="data:image/png;base64," preserveAspectRatio="none"/>
    <rect x="52" y="150" width="330" height="390" fill="#7C3AED" opacity=".13"/>
  </g>
  <path d="M420 105V580" stroke="#0891B2" stroke-width="1.5" opacity=".8"/>

  <text x="455" y="137" class="mono" font-size="19" font-weight="bold" fill="#0891B2">SYSTEM.INFO</text>
  <path d="M455 146H1145" stroke="#0891B2" stroke-opacity=".6"/>
  <g class="mono" font-size="18">
    <text x="458" y="205" fill="#0891B2">ROLE</text><text x="575" y="205" fill="#5C6B82">........:</text><text x="690" y="205" fill="#172033">Java Full Stack Developer</text>
    <text x="458" y="250" fill="#0891B2">FOCUS</text><text x="575" y="250" fill="#5C6B82">........:</text><text x="690" y="250" fill="#172033">Generative AI Enthusiast</text>
    <text x="458" y="295" fill="#0891B2">BUILD</text><text x="575" y="295" fill="#5C6B82">........:</text><text x="690" y="295" fill="#172033">Scalable apps &amp; AI-powered solutions</text>
    <text x="458" y="340" fill="#0891B2">STACK</text><text x="575" y="340" fill="#5C6B82">........:</text><text x="690" y="340" fill="#172033">Java • Spring Boot • React • GenAI</text>
  </g>
  <text x="458" y="397" class="mono" font-size="16" fill="#10B981">TECH.MODULES // ANIMATED SEQUENCE</text>
  <g transform="translate(0,414)">
        <g class="tech t0" transform="translate(590, 0)">
          <rect x="0" y="0" width="122" height="66" rx="12" fill="#FFFFFF" stroke="#F89820" stroke-opacity=".65"/>
          <text x="61" y="29" text-anchor="middle" font-size="23" font-family="Arial,sans-serif" fill="#F89820">J</text>
          <text x="61" y="51" text-anchor="middle" font-size="10" font-family="monospace" letter-spacing="1" fill="#172033">JAVA</text>
        </g>

        <g class="tech t1" transform="translate(727, 0)">
          <rect x="0" y="0" width="122" height="66" rx="12" fill="#FFFFFF" stroke="#6DB33F" stroke-opacity=".65"/>
          <text x="61" y="29" text-anchor="middle" font-size="23" font-family="Arial,sans-serif" fill="#6DB33F">S</text>
          <text x="61" y="51" text-anchor="middle" font-size="10" font-family="monospace" letter-spacing="1" fill="#172033">SPRING BOOT</text>
        </g>

        <g class="tech t2" transform="translate(864, 0)">
          <rect x="0" y="0" width="122" height="66" rx="12" fill="#FFFFFF" stroke="#61DAFB" stroke-opacity=".65"/>
          <text x="61" y="29" text-anchor="middle" font-size="23" font-family="Arial,sans-serif" fill="#61DAFB">R</text>
          <text x="61" y="51" text-anchor="middle" font-size="10" font-family="monospace" letter-spacing="1" fill="#172033">REACT</text>
        </g>

        <g class="tech t3" transform="translate(1001, 0)">
          <rect x="0" y="0" width="122" height="66" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-opacity=".65"/>
          <text x="61" y="29" text-anchor="middle" font-size="23" font-family="Arial,sans-serif" fill="#10B981">AI</text>
          <text x="61" y="51" text-anchor="middle" font-size="10" font-family="monospace" letter-spacing="1" fill="#172033">GENAI</text>
        </g></g>
  <path d="M455 510H1145" stroke="#0891B2" stroke-width="1.5" opacity=".7"/>
  <text x="458" y="548" class="mono" font-size="17" fill="#10B981">&gt;&gt;</text>
  <text x="492" y="548" class="mono" font-size="17" fill="#5C6B82">github.com/student-mahesh</text>
  <text x="1110" y="548" class="mono blink" font-size="21" fill="#7C3AED">█</text>
</svg>
